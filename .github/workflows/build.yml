name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate iOS App Icon
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          sips -s format png -z 1024 1024 icon.png --out Assets.xcassets/AppIcon.appiconset/icon-1024.png
          cat << 'EOF' > Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project SARPBC.xcodeproj \
            -scheme SARPBC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SARPBC.app Payload/
          zip -r SARPBC.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SARPBC-IPA
          path: SARPBC.ipa
